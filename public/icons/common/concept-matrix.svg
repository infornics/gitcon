<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="gitcon-hex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#38A3A5" />
    </linearGradient>
  </defs>

  <!-- Left Main Commit Spine -->
  <line x1="7.5" y1="6" x2="7.5" y2="18" stroke="url(#gitcon-hex)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Smooth geometric branch arc -->
  <path d="M7.5 13.5 C 7.5 8.5, 16.5 10.5, 16.5 6" fill="none" stroke="url(#gitcon-hex)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Commit Nodes -->
  <circle cx="7.5" cy="6" r="2.5" fill="#171614" stroke="#5EEAD4" stroke-width="2" />
  <circle cx="7.5" cy="18" r="2.5" fill="#171614" stroke="#38A3A5" stroke-width="2" />
  <circle cx="16.5" cy="6" r="2.5" fill="#5EEAD4" />

  <!-- Heatmap Micro-Matrix: 2x2 rounded pill grid indicating commit density -->
  <rect x="13" y="13" width="3" height="3" rx="1" fill="#38A3A5" opacity="0.4" />
  <rect x="17.5" y="13" width="3" height="3" rx="1" fill="#38A3A5" opacity="0.7" />
  <rect x="13" y="17.5" width="3" height="3" rx="1" fill="#38A3A5" opacity="0.6" />
  <rect x="17.5" y="17.5" width="3" height="3" rx="1" fill="#5EEAD4" />
</svg>

