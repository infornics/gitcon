<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="git-g-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
  </defs>

  <!-- Left vertical trunk spine of 'G' -->
  <line x1="5.5" y1="7.5" x2="5.5" y2="16.5" stroke="url(#git-g-gradient)" stroke-width="2.4" stroke-linecap="round" />

  <!-- The overarching 'G' contour from top spine over the right and inward -->
  <path
    d="M 5.5 7.5
       C 5.5 4, 18.5 4, 18.5 7.5
       C 18.5 7.5, 18.5 10, 18.5 16.5
       C 18.5 20, 5.5 20, 5.5 16.5"
    stroke="url(#git-g-gradient)"
    stroke-width="2.4"
    stroke-linecap="round"
  />

  <!-- The Git Branch / Crossbar forming the inner 'G' tongue -->
  <path
    d="M 12 12
       L 18.5 12"
    stroke="url(#git-g-gradient)"
    stroke-width="2.4"
    stroke-linecap="round"
  />

  <!-- Diagonal fork connecting lower-left trunk up to inner crossbar -->
  <path
    d="M 5.5 14
       C 8.5 14, 9 12, 12 12"
    stroke="url(#git-g-gradient)"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Strategic Commit Nodes defining the letterform -->
  <circle cx="5.5" cy="7.5" r="2.2" fill="#171614" stroke="#5EEAD4" stroke-width="2" />
  <circle cx="5.5" cy="16.5" r="2.2" fill="#171614" stroke="#2DD4BF" stroke-width="2" />
  <circle cx="12" cy="12" r="2" fill="#5EEAD4" />
  <circle cx="18.5" cy="12" r="2.2" fill="#5EEAD4" />
</svg>
